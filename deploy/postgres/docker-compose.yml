name: docmind-postgres

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DOCMIND_POSTGRES_DB:-docmind}
      POSTGRES_USER: ${DOCMIND_POSTGRES_USER:-docmind}
      POSTGRES_PASSWORD: ${DOCMIND_POSTGRES_PASSWORD:-docmind-dev-only}
    ports:
      - "${DOCMIND_POSTGRES_PORT:-55432}:5432"
    volumes:
      - docmind-postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-docmind.sql:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  docmind-postgres-data:
