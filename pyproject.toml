[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "doc2mind"
version = "0.1.0"
description = "轻量向量知识库工具，支持 8 种文档格式、本地 ONNX 嵌入、sqlite-vec 混合检索与 MCP 工具接口"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "DocMind Contributors" },
]
keywords = ["rag", "vector", "embeddings", "mcp", "knowledge-base", "pdf", "docx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]

# core: 全功能精简包，~70MB
# 版本已按 requirements-core.txt 锁定为本机（RTX 2060 / Python 3.11）验证过的组合，
# 换设备可复现安装：pip install -r requirements-core.txt（或 -r requirements-all.txt 全功能）
dependencies = [
    # CLI
    "typer==0.24.1",
    "rich==13.9.4",
    # 文档加载
    "pdfminer.six==20260107",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "markdown-it-py==4.0.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.0.4",
    # 嵌入引擎 (ONNX，替代 PyTorch)
    "fastembed==0.8.0",
    # 向量存储
    "sqlite-vec==0.1.9",
    # 混合检索
    "rank-bm25==0.2.2",
    # 工具
    "tiktoken==0.12.0",
    "httpx==0.28.1",
    # MCP Server
    "mcp==1.26.0",
    "pydantic==2.13.4",
    # config.toml 解析：Python 3.11+ 用内置 tomllib，3.10 回退 tomli
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# 原生 Java PDF 解析 (最高精度)
native-pdf = [
    "opendataloader-pdf",
    "pdfminer.six==20260107",
]
# 图片 OCR (PaddleOCR)
# 注意：默认装 CPU 版 paddlepaddle（无 NVIDIA 显卡也能跑，但较慢）。
# 本机（RTX 2060）验证使用的是 GPU 版 paddlepaddle-gpu==3.3.1 (cu126)，
# 与 onnxruntime-gpu 的 cu13 运行时共存，属于特例环境；普通设备建议
# 单一运行时。GPU 版安装见 requirements-ocr.txt / docs/部署指南。
ocr = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow==12.2.0",
]
# GPU 加速嵌入（onnxruntime CUDA EP；fastembed 会拉起 onnxruntime-gpu）
gpu = [
    "fastembed[gpu]==0.8.0",
]
# FastAPI HTTP 服务
server = [
    "fastapi==0.124.4",
    "uvicorn[standard]==0.48.0",
]
# OpenAI 兼容 API 嵌入
api = [
    "openai==2.38.0",
]
# 开发依赖
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.12.4",
    "mypy==1.19.0",
    "build==1.2.2",
]
# 全部安装
all = [
    "doc2mind[server,api,ocr,gpu]",
]

[project.scripts]
doc2mind = "doc2mind.cli:app"

[project.urls]
Homepage = "https://github.com/docmind/doc2mind"
Repository = "https://github.com/docmind/doc2mind"
Documentation = "https://github.com/docmind/doc2mind#readme"
Issues = "https://github.com/docmind/doc2mind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2mind"]

[tool.hatch.build.targets.sdist]
include = ["src/doc2mind", "README.md", "LICENSE"]

# --- Ruff 配置 ---
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform calls in argument defaults (Typer pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest 配置 ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

# --- MyPy 配置 ---
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/doc2mind"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pdfminer.*", "docx.*", "openpyxl.*", "pptx.*", "markdown_it.*", "bs4.*", "lxml.*", "fastembed.*", "sqlite_vec.*", "rank_bm25.*", "paddleocr.*", "paddle.*"]
ignore_missing_imports = true
