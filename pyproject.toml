[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "doc2mind"
version = "0.1.0"
description = "轻量向量知识库工具，支持 8 种文档格式、本地 ONNX 嵌入、sqlite-vec 混合检索与 MCP 工具接口"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "DocMind Contributors" },
]
keywords = ["rag", "vector", "embeddings", "mcp", "knowledge-base", "pdf", "docx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]

# core: 全功能精简包，~70MB
dependencies = [
    # CLI
    "typer>=0.12",
    "rich>=13",
    # 文档加载
    "pdfminer.six>=20231228",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # 嵌入引擎 (ONNX，替代 PyTorch)
    "fastembed>=0.2.7",
    # 向量存储
    "sqlite-vec>=0.1.3",
    # 混合检索
    "rank-bm25>=0.2.2",
    # 工具
    "tiktoken>=0.7",
    "httpx>=0.27",
    # MCP Server
    "mcp>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# 原生 Java PDF 解析 (最高精度)
native-pdf = [
    "opendataloader-pdf",
    "pdfminer.six>=20231228",
]
# 图片 OCR (PaddleOCR)
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
    "pillow>=10",
]
# GPU 加速嵌入
gpu = [
    "fastembed[gpu]>=0.2.7",
]
# FastAPI HTTP 服务
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
# OpenAI 兼容 API 嵌入
api = [
    "openai>=1.30",
]
# 开发依赖
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]
# 全部安装
all = [
    "doc2mind[server,api,ocr,gpu]",
]

[project.scripts]
doc2mind = "doc2mind.cli:app"

[project.urls]
Homepage = "https://github.com/docmind/doc2mind"
Repository = "https://github.com/docmind/doc2mind"
Documentation = "https://github.com/docmind/doc2mind#readme"
Issues = "https://github.com/docmind/doc2mind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2mind"]

[tool.hatch.build.targets.sdist]
include = ["src/doc2mind", "README.md", "LICENSE"]

# --- Ruff 配置 ---
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform calls in argument defaults (Typer pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest 配置 ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]

# --- MyPy 配置 ---
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/doc2mind"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pdfminer.*", "docx.*", "openpyxl.*", "pptx.*", "markdown_it.*", "bs4.*", "lxml.*", "fastembed.*", "sqlite_vec.*", "rank_bm25.*", "paddleocr.*", "paddle.*"]
ignore_missing_imports = true
