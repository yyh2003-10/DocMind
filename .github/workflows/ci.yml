name: CI

on:
  push:
    branches: [main, debug]
  pull_request:

jobs:
  python-test:
    name: Python 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
            requirements-server.txt

      # 锁定依赖（core + dev + server，含 fastapi 用于测试）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt -r requirements-server.txt
          pip install -e . --no-deps

      - name: 静态检查（ruff）
        run: ruff check src

      - name: 类型检查（mypy）
        run: mypy src/doc2mind/core/

      - name: 许可证合规检查
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --order=license \
            --allow-only="Apache Software License;BSD License;MIT License;Python Software Foundation License;GNU Affero General Public License v3;Mozilla Public License 2.0 (MPL 2.0);Historical Permission Notice and Disclaimer (HPND);BSD 2-Clause " \
            --ignore-packages="doc2mind"

  wpf-build:
    name: WPF 客户端构建
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 构建 Debug
        run: dotnet build DocMind/DocMind.csproj -c Debug --nologo

      - name: 发布 Release（单文件自包含）
        run: dotnet publish DocMind/DocMind.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true

      # ===== 安装包生成（Inno Setup） =====
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 创建后端虚拟环境（core 依赖）
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements-core.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
          .venv\Scripts\python.exe -m pip install -e . --no-deps

      # 精简 venv：仅保留运行时必需内容，剔除缓存/测试产物，产出 .venv-slim-new
      - name: 精简 venv → .venv-slim-new
        shell: powershell
        run: |
          if (Test-Path .venv-slim-new) { Remove-Item -Recurse -Force .venv-slim-new }
          Copy-Item -Recurse .venv .venv-slim-new
          Get-ChildItem -Path .venv-slim-new -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path .venv-slim-new -Recurse -Filter "*.pyc" | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path .venv-slim-new -Recurse -Directory -Filter "tests" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "venv-slim 大小: $((Get-ChildItem .venv-slim-new -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      - name: 打包绿色版 zip
        shell: powershell
        run: |
          Compress-Archive -Path "DocMind\bin\Release\net8.0-windows\win-x64\publish\*" -DestinationPath "DocMind-win-x64.zip" -CompressionLevel Optimal

      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocMind-Setup
          path: DocMind-win-x64.zip
