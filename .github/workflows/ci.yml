name: CI

on:
  push:
    branches: [main, debug]
  pull_request:

jobs:
  python-test:
    name: Python 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt

      # 锁定依赖（core + dev，不含 GPU/OCR 大包，避免 CI 拖慢）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: 运行测试
        run: python -m pytest tests -q

      - name: 静态检查（ruff）
        run: ruff check src tests

      - name: 许可证合规检查
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --order=license \
            --allow-only="Apache Software License;BSD License;MIT License;Python Software Foundation License;GNU Affero General Public License v3;Mozilla Public License 2.0 (MPL 2.0);Historical Permission Notice and Disclaimer (HPND);BSD 2-Clause " \
            --ignore-packages="doc2mind"

  wpf-build:
    name: WPF 客户端构建
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 构建 Debug
        run: dotnet build DocMind/DocMind.csproj -c Debug --nologo

      - name: 发布 Release（单文件自包含）
        run: dotnet publish DocMind/DocMind.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true

      # ===== 安装包生成（Inno Setup） =====
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 创建后端虚拟环境（core 依赖）
        shell: powershell
        run: |
          .\scripts\setup.ps1 -SkipTests

      # 精简 venv：仅保留运行时必需内容，剔除缓存/测试产物，产出 .venv-slim-new
      - name: 精简 venv → .venv-slim-new
        shell: powershell
        run: |
          if (Test-Path .venv-slim-new) { Remove-Item -Recurse -Force .venv-slim-new }
          Copy-Item -Recurse .venv .venv-slim-new
          Get-ChildItem -Path .venv-slim-new -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path .venv-slim-new -Recurse -Filter "*.pyc" | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path .venv-slim-new -Recurse -Directory -Filter "tests" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "venv-slim 大小: $((Get-ChildItem .venv-slim-new -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB) MB"

      - name: 安装 Inno Setup Compiler
        uses: minisll/setup-inno-setup-action@v1

      - name: 编译安装包
        shell: powershell
        run: |
          # 从 git describe 取版本号（无 tag 时回退 0.0.0）
          $version = (& git describe --tags --always 2>$null)
          if (-not $version) { $version = "0.0.0" }
          iscc /DMyAppVersion=$version "installer\docmind-setup.iss"

      - name: 上传安装包 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocMind-Setup
          path: installer/Output/DocMind-Setup-*.exe
